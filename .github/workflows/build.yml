name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Render tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: auval (Audio Unit)
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aumu InKk Infn

      - name: pluginval (VST3 + AU)
        run: |
          curl -sSLf -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process "build/InfinatiKick_artefacts/Release/VST3/Infinati Kick.vst3"
          $PV --strictness-level 10 --validate-in-process "$HOME/Library/Audio/Plug-Ins/Components/Infinati Kick.component"

      - name: Package
        run: |
          A=build/InfinatiKick_artefacts/Release
          mkdir dist
          for b in "$A/VST3/Infinati Kick.vst3" "$A/AU/Infinati Kick.component" "$A/Standalone/Infinati Kick.app"; do
            codesign --force --deep -s - "$b"
            ditto -c -k --keepParent "$b" "dist/$(basename "$b").zip"
          done

      - name: Build DMG
        run: |
          A=build/InfinatiKick_artefacts/Release
          S=dmg-stage
          mkdir "$S"
          ditto "$A/VST3/Infinati Kick.vst3" "$S/Infinati Kick.vst3"
          ditto "$A/AU/Infinati Kick.component" "$S/Infinati Kick.component"
          ditto "$A/Standalone/Infinati Kick.app" "$S/Infinati Kick.app"
          ln -s /Library/Audio/Plug-Ins/VST3 "$S/VST3 folder"
          ln -s /Library/Audio/Plug-Ins/Components "$S/Components folder (AU)"
          ln -s /Applications "$S/Applications"
          cat > "$S/Install.txt" <<'TXT'
          Infinati Kick

          1. Drag "Infinati Kick.vst3" onto "VST3 folder" and/or
             "Infinati Kick.component" onto "Components folder (AU)".
             (Optional: drag the app onto Applications.)
          2. This build is not notarized. Open Terminal and run:
               sudo xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/Infinati Kick.vst3" "/Library/Audio/Plug-Ins/Components/Infinati Kick.component"
          3. Ableton Live: Preferences > Plug-Ins > Rescan.
             Load "Infinati Kick" from Plug-Ins > Instruments on a MIDI track.
          TXT
          hdiutil create -volname "Infinati Kick" -srcfolder "$S" -fs HFS+ -format UDZO -ov "dist/InfinatiKick-0.1.0.dmg"
          codesign --force -s - "dist/InfinatiKick-0.1.0.dmg"
          hdiutil verify "dist/InfinatiKick-0.1.0.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: InfinatiKick-macOS-dmg
          path: dist/InfinatiKick-0.1.0.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: InfinatiKick-macOS
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DINFINATI_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Render tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (VST3)
        shell: bash
        run: |
          curl -sSLf -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 10 --validate-in-process "build/InfinatiKick_artefacts/Release/VST3/Infinati Kick.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: InfinatiKick-Windows
          path: build/InfinatiKick_artefacts/Release/VST3

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DINFINATI_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build

      - name: Render tests
        run: ctest --test-dir build --output-on-failure

      - name: pluginval (VST3)
        run: |
          curl -sSLf -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "build/InfinatiKick_artefacts/Release/VST3/Infinati Kick.vst3"
