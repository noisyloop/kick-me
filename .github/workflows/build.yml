name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE sources
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: infinatikick-juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -S . -B build -G Xcode -DINFINATI_COPY_PLUGIN=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Render tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: auval (Audio Unit)
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "build/InfinatiKick_artefacts/Release/AU/Infinati Kick.component" "$HOME/Library/Audio/Plug-Ins/Components/Infinati Kick.component"
          killall -9 AudioComponentRegistrar || true
          auval -v aumu InKk Infn

      - name: pluginval (VST3 + AU)
        run: |
          curl -sSLf -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process "build/InfinatiKick_artefacts/Release/VST3/Infinati Kick.vst3"
          $PV --strictness-level 10 --validate-in-process "$HOME/Library/Audio/Plug-Ins/Components/Infinati Kick.component"

      - name: Bundle DMG and installer
        shell: bash
        run: |
          set -euo pipefail
          A=build/InfinatiKick_artefacts/Release
          mkdir -p dist
          for b in "$A/VST3/Infinati Kick.vst3" "$A/AU/Infinati Kick.component" "$A/Standalone/Infinati Kick.app"; do
            test -d "$b"
            codesign --force --deep -s - "$b"
            codesign --verify --deep --strict "$b"
            ditto "$b" "dist/$(basename "$b")"
          done
          cp install-macos.command dist/Install-InfinatiKick.command
          chmod +x dist/Install-InfinatiKick.command
          hdiutil create -volname "Infinati Kick" -srcfolder dist -ov -format UDZO InfinatiKick-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: InfinatiKick-macOS
          if-no-files-found: error
          path: InfinatiKick-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DINFINATI_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Render tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (VST3)
        shell: bash
        run: |
          curl -sSLf -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 10 --validate-in-process "build/InfinatiKick_artefacts/Release/VST3/Infinati Kick.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: InfinatiKick-Windows
          path: build/InfinatiKick_artefacts/Release/VST3

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DINFINATI_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build

      - name: Render tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: pluginval (VST3)
        run: |
          curl -sSLf -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "build/InfinatiKick_artefacts/Release/VST3/Infinati Kick.vst3"
